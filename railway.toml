[build]
builder = "nixpacks"
buildCommand = "cd NagAgent-Backend-Python && pip install -r requirements.txt"

[deploy]
startCommand = "cd NagAgent-Backend-Python && uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 100
restartPolicyType = "always"

[envs]
PYTHON_VERSION = "3.11"